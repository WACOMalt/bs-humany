server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The studio serves itself cross-origin isolated (ADR-008/ADR-010): SharedArrayBuffer and
    # MuJoCo's threaded build must be available even though nothing assumes them.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    gzip on;
    gzip_types application/javascript application/json application/wasm text/css application/octet-stream;
    gzip_min_length 1024;

    # nginx's own mime.types already maps .wasm to application/wasm; a `types` block here would
    # replace the whole table, so none is declared.

    location /assets/ {
        # Hashed file names: safe to cache for a year.
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        try_files $uri $uri/ /index.html;
    }
}
