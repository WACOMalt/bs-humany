[package]
name = "bs-humany-xr-viewer"
version = "0.2.0"
description = "The bs-humany OpenXR headset viewer: body, muscles and panels, native and outside the web view."
edition = "2021"
license = "Apache-2.0"
publish = false
rust-version = "1.77.2"

[dependencies]
# The OpenXR loader's bindings. `loaded` rather than `linked`: the loader is opened at run time
# with dlopen rather than linked at build time. Two reasons, and the second is the real one.
# Linking wants libopenxr_loader.so, which lives in a -devel package a user running the binary has
# no reason to have -- while libopenxr_loader.so.1, which dlopen finds, ships with every runtime.
# And a binary that merely fails to find a loader can say so, where one that will not link cannot
# be built at all on a machine without the headers.
openxr = { version = "0.22", features = ["loaded"] }
# Raw Vulkan rather than wgpu, because OpenXR dictates the instance and device it will accept and
# handing those requirements to a portability layer is the part that goes wrong. See README.
ash = "0.38"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The pose bridge is a file on tmpfs that the simulation writes; mapping it is how a frame is read
# with no copy and no syscall.
memmap2 = "0.9"
egui = "0.29.1"
# Only for `cargo run --example compile-shaders --features compile-shaders`, which regenerates the
# committed SPIR-V. Optional behind a feature rather than a dev-dependency, because cargo builds
# every dev-dependency for `cargo test` as well, and shaderc's build script wants an installed
# libshaderc or a C++ toolchain to compile one: a test run, and CI with it, would need a shader
# toolchain to check code that never compiles a shader. Neither a build nor a test touches it now.
shaderc = { version = "0.9", optional = true }

[features]
compile-shaders = ["dep:shaderc"]

[[example]]
name = "compile-shaders"
required-features = ["compile-shaders"]

[profile.release]
opt-level = 3
lto = true
