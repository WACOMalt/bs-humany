name: CI

# experience-pass is a long-running branch that is never merged or opened as a pull request into
# main, so without its own trigger nothing it carries would ever be checked by CI.
on:
  push:
    branches: [main, experience-pass]
  pull_request:
  workflow_dispatch:

jobs:
  # The same steps, in the same order, as `pnpm verify`.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The version is written in six files -- package.json, tauri.conf.json, and both crates'
      # Cargo.toml and Cargo.lock -- and a bump that misses one ships a release whose two halves
      # disagree about which release they are. Reading six files costs nothing, so it is checked
      # on every push rather than only when a release is built.
      - name: One version everywhere
        run: node tools/cli/bin/release.mjs --check-versions

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Citation coverage
        run: pnpm cite:lint

      - name: Module lint
        run: pnpm module:lint

      # Every generator, measurement, validation report and the section 14.5 audit, with --check,
      # in dependency order. The list is read from package.json (tools/cli/lib/targets.mjs), so a
      # new generator is checked here without editing this file.
      - name: Generated files and reports match their sources
        run: pnpm check:generated

      - name: Test
        run: pnpm test

      # The same build the container image makes, so a type-only import or a Vite config change
      # that breaks the bundle fails here rather than at release.
      - name: Studio builds
        run: pnpm build:studio

  # The headset viewer's own tests. It needs no shader toolchain: shaderc sits behind the
  # compile-shaders feature and the committed SPIR-V is what the viewer embeds.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/xr-viewer

      - name: Viewer tests
        run: cargo test --locked --manifest-path apps/xr-viewer/Cargo.toml

  # The studio in a real browser (apps/studio/e2e): it boots with a clean console, Start runs the
  # body, Space pauses and resumes, the tabs show their panels, and a shipped checkpoint takes
  # charge with no dashboard. Playwright starts the studio's Vite server itself, on port 5299.
  studio-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Only Chromium, and the system libraries it needs, which a runner can install and a
      # developer's machine usually already has.
      - name: Browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke test
        run: pnpm test:e2e

      # A trace for each failed test: the page, the console, the network and every step, to open
      # with `pnpm exec playwright show-trace`.
      - name: Traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: studio-smoke-traces
          path: test-results/
          retention-days: 14
