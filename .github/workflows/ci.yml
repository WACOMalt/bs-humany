name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Citation coverage
        run: pnpm cite:lint

      - name: Module lint
        run: pnpm module:lint

      - name: Generated muscle data matches its source
        run: pnpm generate:elbow-muscles --check

      - name: Generated shoulder data matches its source
        run: pnpm generate:shoulder-muscles --check

      - name: Generated knee data matches its source
        run: pnpm generate:knee-muscles --check

      - name: Generated hip data matches its source
        run: pnpm generate:hip-muscles --check

      - name: Generated ankle data matches its source
        run: pnpm generate:ankle-muscles --check

      - name: Generated via points match their source
        run: pnpm generate:via-points --check

      - name: Measured muscle travel matches this skeleton
        run: pnpm measure:muscle-ranges --check

      - name: Measured source travel matches the vendored models
        run: pnpm measure:source-travel --check

      - name: External validation
        run: pnpm validate:external --check

      - name: Moment arm validation
        run: pnpm validate:moment-arms --check

      - name: Section 14.5 audit
        run: pnpm audit:obligations --check

      - name: Test
        run: pnpm test
