name: CI

# experience-pass is a long-running branch that is never merged or opened as a pull request into
# main, so without its own trigger nothing it carries would ever be checked by CI.
on:
  push:
    branches: [main, experience-pass]
  pull_request:
  workflow_dispatch:

jobs:
  # The same steps, in the same order, as `pnpm verify`.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Citation coverage
        run: pnpm cite:lint

      - name: Module lint
        run: pnpm module:lint

      # Every generator, measurement, validation report and the section 14.5 audit, with --check,
      # in dependency order. The list is read from package.json (tools/cli/lib/targets.mjs), so a
      # new generator is checked here without editing this file.
      - name: Generated files and reports match their sources
        run: pnpm check:generated

      - name: Test
        run: pnpm test

      # The same build the container image makes, so a type-only import or a Vite config change
      # that breaks the bundle fails here rather than at release.
      - name: Studio builds
        run: pnpm build:studio

  # The headset viewer's own tests. It needs no shader toolchain: shaderc sits behind the
  # compile-shaders feature and the committed SPIR-V is what the viewer embeds.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/xr-viewer

      - name: Viewer tests
        run: cargo test --locked --manifest-path apps/xr-viewer/Cargo.toml
